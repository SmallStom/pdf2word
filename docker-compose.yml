version: '3.8'

# ============================================================
# GPU模式（默认）：docker-compose up -d
# CPU模式：docker-compose --profile cpu up -d
# ============================================================
#
# 多卡环境配置说明：
#   CUDA_VISIBLE_DEVICES: 指定使用哪张物理卡（0, 1, 2, 3）
#   PADDLE_GPU_MEMORY_GB: 限制该卡使用的显存（GB）
#
# 例如：用第2张卡，限制3GB显存：
#   CUDA_VISIBLE_DEVICES=2
#   PADDLE_GPU_MEMORY_GB=3
# ============================================================

services:
  # ---- GPU版（默认）----
  pdf2word:
    build: .
    container_name: pdf2word
    profiles: ["", "gpu"]
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HF_ENDPOINT=https://hf-mirror.com
      - PADDLE_DEVICE=gpu
      # 指定使用哪张GPU（0/1/2/3），多卡共享时必改
      - CUDA_VISIBLE_DEVICES=0
      # GPU显存限制（GB），显卡共享时修改此值
      - PADDLE_GPU_MEMORY_GB=4
    volumes:
      - pdf2word_temp:/tmp/pdf2word
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- CPU版（无GPU环境使用）----
  # 启动命令: docker-compose --profile cpu up -d
  pdf2word-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: pdf2word-cpu
    profiles: ["cpu"]
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HF_ENDPOINT=https://hf-mirror.com
      - PADDLE_DEVICE=cpu
    volumes:
      - pdf2word_temp:/tmp/pdf2word
    restart: unless-stopped

volumes:
  pdf2word_temp:
